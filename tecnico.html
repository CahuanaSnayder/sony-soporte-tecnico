<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sony - Panel Técnico</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center shadow-lg border-b border-gray-800">
  <h1 class="text-2xl font-bold tracking-widest text-red-600">SONY <span class="text-xs text-white font-normal">| Área Técnica</span></h1>
  <button onclick="cerrarSesion()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-red-400 font-semibold">Cerrar Sesión</button>
</nav>

<div class="max-w-7xl mx-auto my-8 px-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Revisión y Expediente de Equipos</h2>
      <p class="text-xs text-gray-500">Examina comprobantes, fotos adjuntas y registra dictámenes.</p>
    </div>

    <div class="flex gap-2 w-full md:w-auto">
      <select id="filtroGravedad" onchange="cargarTicketsTecnico()" class="border text-xs px-3 py-2 rounded focus:outline-none">
        <option value="TODAS">Todas las Gravedades</option>
        <option value="ALTA"> Gravedad ALTA (Urgente)</option>
        <option value="MEDIA"> Gravedad MEDIA</option>
        <option value="BAJA"> Gravedad BAJA</option>
      </select>
      <input type="text" id="buscadorTecnico" onkeyup="cargarTicketsTecnico()" placeholder="Buscar ticket..." class="border text-xs px-3 py-2 rounded w-48 focus:outline-none">
    </div>
  </div>

  <div id="tablaTickets" class="grid grid-cols-1 gap-4"></div>
</div>

<!-- 🌟 MODAL DINÁMICO PERSONALIZADO (REEMPLAZO DE PROMPT / CONFIRM DE NAVEGADOR) -->
<div id="modalDinamico" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4 transition-opacity duration-300">
  <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-200 transform scale-100 transition-all">
    <!-- Header del Modal -->
    <div class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center border-b border-red-600">
      <h3 id="modalTitulo" class="font-bold text-sm tracking-wide flex items-center gap-2">
        <!-- Icono y Título Dinámico -->
      </h3>
      <button onclick="cerrarModalDinamico()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
    </div>

    <!-- Cuerpo del Modal -->
    <div class="p-6 space-y-4">
      <p id="modalMensaje" class="text-xs text-gray-600 leading-relaxed"></p>

      <div id="contenedorInputModal" class="space-y-3">
        <label id="labelInputModal" class="block text-xs font-semibold text-gray-700 uppercase"></label>
        <textarea id="inputTextoModal" rows="3" class="w-full border border-gray-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="Escribe aquí..."></textarea>

        <div id="contenedorCosto" class="hidden space-y-1">
          <label class="block text-xs font-semibold text-gray-700 uppercase">Costo Estimado de Reparación (S/.)</label>
          <input type="number" id="inputCostoModal" min="0" class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="0.00">
        </div>

        <div id="contenedorGarantia" class="hidden bg-gray-50 p-3 rounded-lg border border-gray-200">
          <label class="flex items-center gap-2 text-xs text-gray-700 font-semibold cursor-pointer">
            <input type="checkbox" id="checkGarantiaModal" class="rounded text-red-600 focus:ring-red-500 w-4 h-4">
            ¿Aplica Cubrimiento por Garantía Oficial Sony?
          </label>
        </div>
      </div>
    </div>

    <!-- Botones del Modal -->
    <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-end gap-2">
      <button onclick="cerrarModalDinamico()" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-600 bg-gray-200 hover:bg-gray-300 transition">
        Cancelar
      </button>
      <button id="btnAccionModal" class="px-4 py-2 rounded-lg text-xs font-bold text-white bg-red-600 hover:bg-red-700 transition shadow">
        <!-- Texto de Acción Dinámico -->
      </button>
    </div>
  </div>
</div>

<script src="js/tecnico.js"></script>
</body>
</html>
