<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sony - Panel Administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-red-700 text-white px-6 py-4 flex justify-between items-center shadow-lg">
  <h1 class="text-2xl font-bold tracking-widest text-white">SONY <span class="text-xs font-normal opacity-80">| Administración General</span></h1>
  <button onclick="cerrarSesion()" class="text-xs bg-black hover:bg-gray-800 px-3.5 py-1.5 rounded text-white font-medium">Cerrar Sesión</button>
</nav>

<div class="max-w-7xl mx-auto my-8 px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

  <!-- Formulario para Registrar Técnicos -->
  <div class="bg-white p-6 rounded-xl shadow border border-gray-200 col-span-1 h-fit">
    <h2 class="text-base font-bold text-gray-800 mb-1">👨‍🔧 Registrar Nuevo Técnico</h2>
    <p class="text-xs text-gray-500 mb-4">Añade personal técnico al sistema.</p>

    <form id="nuevoTecnicoForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Nombres</label>
        <input type="text" id="tecNombres" required class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Apellidos</label>
        <input type="text" id="tecApellidos" required class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Correo Corporativo</label>
        <input type="email" id="tecCorreo" required class="w-full border rounded px-3 py-1.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Contraseña</label>
        <input type="password" id="tecPassword" required class="w-full border rounded px-3 py-1.5 text-sm" value="tecnico123">
      </div>
      <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-2 rounded text-sm transition">
        + Registrar Técnico
      </button>
    </form>
  </div>

  <!-- Tabla y Validación de Precios -->
  <div class="col-span-1 lg:col-span-2 space-y-6">
    <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
        <h2 class="text-sm font-bold text-gray-800">Control de Tickets y Validación de Precios</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
          <tr class="bg-gray-100 text-gray-600 uppercase text-[11px]">
            <th class="py-2.5 px-3">Código</th>
            <th class="py-2.5 px-3">Producto / Boleta</th>
            <th class="py-2.5 px-3">Estado</th>
            <th class="py-2.5 px-3">Precio Propuesto</th>
            <th class="py-2.5 px-3 text-center">Validación Presupuesto</th>
          </tr>
          </thead>
          <tbody id="tablaAdmin" class="divide-y divide-gray-200 text-xs"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
