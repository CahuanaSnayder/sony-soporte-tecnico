<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sony Soporte Técnico - Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen py-8">

<div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold tracking-widest text-red-600">SONY</h1>
    <p class="text-sm text-gray-400 mt-1">Sistema Web de Soporte Técnico</p>
  </div>

  <!-- Pestañas Login / Registro -->
  <div class="flex border-b border-gray-700 mb-6 text-sm">
    <button id="tabLoginBtn" onclick="switchTab('login')" class="w-1/2 py-2 border-b-2 border-red-500 font-bold text-red-500">Iniciar Sesión</button>
    <button id="tabRegBtn" onclick="switchTab('register')" class="w-1/2 py-2 border-b-2 border-transparent text-gray-400 hover:text-white">Registrarse</button>
  </div>

  <!-- Form Iniciar Sesión -->
  <form id="loginForm" class="space-y-4">
    <div>
      <label class="block text-xs text-gray-400 mb-1">Correo Electrónico</label>
      <input type="email" id="correo" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="ejemplo@sony.com">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">Contraseña</label>
      <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="••••••••">
    </div>
    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm transition">
      Ingresar
    </button>
  </form>

  <!-- Form Registro Cliente -->
  <form id="registerForm" class="space-y-3 hidden">
    <div>
      <label class="block text-xs text-gray-400 mb-1">Nombres</label>
      <input type="text" id="regNombres" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="Ej. Juan">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">Apellidos</label>
      <input type="text" id="regApellidos" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="Ej. Pérez">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">Correo Electrónico</label>
      <input type="email" id="regCorreo" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="tu.correo@ejemplo.com">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">Contraseña</label>
      <input type="password" id="regPassword" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-red-500" required placeholder="••••••••">
    </div>
    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded text-sm transition mt-2">
      Crear Mi Cuenta Cliente
    </button>
  </form>

  <div class="mt-6 text-xs text-center text-gray-400 bg-gray-900/50 p-3 rounded">
    <p class="font-bold text-gray-300 mb-1">Credenciales rápidas:</p>
    <p><span class="text-red-400">Cliente:</span> cliente@sony.com | cliente123</p>
    <p><span class="text-red-400">Técnico:</span> tecnico@sony.com | tecnico123</p>
    <p><span class="text-red-400">Admin:</span> admin@sony.com | admin123</p>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
