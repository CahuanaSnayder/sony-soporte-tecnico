<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sony - Portal Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-black text-white px-6 py-4 flex justify-between items-center shadow-lg border-b border-red-600">
  <h1 class="text-2xl font-bold tracking-widest text-red-600">SONY <span class="text-xs text-gray-300 font-normal">| Portal Cliente</span></h1>
  <div class="flex items-center space-x-4">
    <span id="nombreUsuario" class="text-xs text-gray-300"></span>
    <button onclick="cerrarSesion()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-white font-semibold">Cerrar Sesión</button>
  </div>
</nav>

<nav aria-label="Opciones de productos" class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-3 flex flex-wrap items-center gap-3">
    <a href="https://www.sony.com.pe/" target="_blank" rel="noopener noreferrer"
       class="text-sm font-semibold text-gray-700 hover:text-red-600 px-3 py-2 rounded transition">
      Ver productos Sony
    </a>
  </div>
</nav>

<div class="max-w-7xl mx-auto my-8 px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

  <!-- Formulario con Validación de Boleta y Garantía -->
  <div class="bg-white p-6 rounded-xl shadow border border-gray-200 col-span-1 h-fit">
    <h2 class="text-base font-bold text-gray-800 mb-1">Nueva Solicitud de Servicio</h2>
    <p class="text-xs text-gray-500 mb-4">Ingresa la información del producto y tu boleta.</p>

    <form id="ticketForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Producto Sony</label>
        <input type="text" id="producto" required class="w-full border rounded px-3 py-1.5 text-sm focus:ring-1 focus:ring-red-500" placeholder="Ej. PlayStation 5 / TV Bravia">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Número de Serie/Codigo de barra</label>
        <input type="text" id="numeroSerie" required class="w-full border rounded px-3 py-1.5 text-sm" placeholder="SN-XXXXX">
      </div>

      <!-- Datos de la Boleta -->
      <div class="grid grid-cols-2 gap-2 bg-gray-50 p-2.5 rounded border border-gray-200">
        <div>
          <label class="block text-[11px] font-semibold text-gray-700 uppercase">N° de Boleta</label>
          <input type="text" id="numeroBoleta" required class="w-full border rounded px-2 py-1 text-xs" placeholder="B001-1234">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-gray-700 uppercase">Fecha de Compra</label>
          <input type="date" id="fechaCompra" required class="w-full border rounded px-2 py-1 text-xs">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Categoría</label>
        <select id="categoria" class="w-full border rounded px-3 py-1.5 text-sm">
          <option value="Consolas / Gaming">Gaming / PlayStation</option>
          <option value="Televisores">TV y Video</option>
          <option value="Audio">Audio y Sonido</option>
          <option value="Fotografía">Cámaras / Video</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Descripción de la Falla</label>
        <textarea id="descripcionFalla" rows="3" required class="w-full border rounded px-3 py-1.5 text-sm" placeholder="Explica detalladamente qué sucede..."></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Foto / Pruebas del Daño</label>
        <input type="file" id="fotoEvidencia" accept="image/*" class="w-full text-xs text-gray-500 border rounded py-1 px-2 mt-1">
      </div>

      <div class="bg-amber-50 border-l-4 border-amber-400 p-2.5 rounded text-[11px] text-amber-800">
        <strong>⚠️ Advertencia:</strong> Se realizarán 2 evaluaciones: 1) Verificación de validez de Boleta/Garantía y 2) Evaluación Técnica de la falla.
      </div>

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm transition">
        + Enviar Solicitud
      </button>
    </form>
  </div>

  <!-- Lista de Tickets del Cliente -->
  <div class="bg-white p-6 rounded-xl shadow border border-gray-200 col-span-1 lg:col-span-2">
    <h2 class="text-base font-bold text-gray-800 mb-4">Mis Tickets Registrados</h2>
    <div id="listaTickets" class="space-y-4"></div>
  </div>

</div>

<script src="js/cliente.js"></script>
</body>
</html>
